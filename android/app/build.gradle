plugins { id 'com.android.application' }
def pkg = new groovy.json.JsonSlurper().parse(file('../../package.json'))
android {
    namespace 'org.torrenter.watcher'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'org.torrenter.watcher'
        minSdk 24
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VOLKINO_VERSION_CODE') ?: '902')
        versionName pkg.version
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', '-DANDROID_STL=c++_shared'; cppFlags '-std=c++17' } }
    }
    flavorDimensions += 'runtime'
    productFlavors {
        modern {
            dimension 'runtime'
            externalNativeBuild { cmake { arguments "-DVOLKINO_NODE_DIR=${rootProject.projectDir}/vendor/node" } }
        }
        android6 {
            dimension 'runtime'
            minSdk 23
            externalNativeBuild { cmake { arguments "-DVOLKINO_NODE_DIR=${rootProject.projectDir}/vendor/node-android6" } }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets {
        modern { assets.srcDirs = ['build/generated/modern/assets']; jniLibs.srcDirs = ['build/generated/modern/jniLibs'] }
        android6 { assets.srcDirs = ['build/generated/android6/assets']; jniLibs.srcDirs = ['build/generated/android6/jniLibs'] }
    }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libnode.so', '**/libtorrserver.so'] } }
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
}

// Keep Android Studio and command-line builds in sync with the webOS UI and helper.
def buildUi = tasks.register('buildVolkinoUi', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'npm', 'run', 'build:ui'
}
['modern', 'android6'].each { flavor ->
    def flavorName = flavor.capitalize()
    def prepareRuntime = tasks.register("prepareVolkinoRuntime${flavorName}", Exec) {
        dependsOn buildUi
        workingDir rootProject.projectDir.parentFile
        commandLine(['node', 'scripts/android.mjs', '--prepare'] + (flavor == 'android6' ? ['--android6'] : []))
    }
    tasks.configureEach {
        if (name.startsWith("pre${flavorName}") ||
            (name.startsWith('configureCMake') && hasProperty('variantName') && variantName.startsWith(flavor))) dependsOn prepareRuntime
    }
}

dependencies {
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    implementation 'androidx.core:core:1.15.0'
}
