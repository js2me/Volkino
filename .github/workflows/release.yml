name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webos:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webos
          path: dist/*.ipk
          if-no-files-found: error

  android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: npm ci
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          echo "VOLKINO_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - run: npm run build:android:release
      - run: npm run build:android
      - name: Verify APK signatures
        shell: bash
        run: |
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
      - name: Remove signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: [webos, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release with all packages
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          cd dist
          sha256sum -- *.ipk *.apk > SHA256SUMS.txt
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" ./*.ipk ./*.apk SHA256SUMS.txt --clobber
          else
            gh release create "$tag" ./*.ipk ./*.apk SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "VolKino ${version} · build ${GITHUB_RUN_NUMBER}" \
              --generate-notes --latest
          fi
